<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>this image 3d image</title>
<style>html,body{margin:0;height:100%;background:#0d0d0c;overflow:hidden;font-family:system-ui,sans-serif}#hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#9a9aa5;font-size:12px;pointer-events:none}#rp{position:fixed;top:10px;right:10px;background:#1a1a1f;color:#cfd0ea;border:1px solid #2e2e3a;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}#err{position:fixed;top:10px;left:10px;right:10px;color:#e88;font-size:12px}</style></head><body>
<div id="err"></div><button id="rp">Replay build</button><div id="hint">Drag to rotate - scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function buildModel(THREE){
const group = new THREE.Group()
function part(geo, color, x, y, z) { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 })); m.position.set(x, y, z); group.add(m); return m }

const colors = {
  brick: 0x777777,
  white: 0xffffff,
  black: 0x000000,
  wood: 0x8b5a2b,
  lawn: 0x228b22,
  mulch: 0x654321,
  concrete: 0xaaaaaa,
  trunk: 0x8b4513,
  foliage: 0x2e8b57,
  roofGable: 0x444444,
  glass: 0xdddddd
}

// --- Landscaping -------------------------------------------------
part(new THREE.BoxGeometry(30, 0.1, 30), colors.lawn, 0, 0.05, 0)               // lawn
part(new THREE.BoxGeometry(12, 0.05, 2), colors.mulch, 0, 0.025, -5)           // mulch strip

// Tree
part(new THREE.CylinderGeometry(0.3, 0.3, 4, 12), colors.trunk, -12, 2, -5)   // trunk
part(new THREE.SphereGeometry(2, 16, 12), colors.foliage, -12, 6.05, -5)      // canopy

// Driveway (simple curved approximation using two slabs)
part(new THREE.BoxGeometry(6, 0.1, 2), colors.concrete, -3, 0.05, -8)          // front slab
part(new THREE.BoxGeometry(8, 0.1, 2), colors.concrete, 2, 0.05, -4)           // rear slab

// --- Main wing ----------------------------------------------------
const mainWidth = 12, mainDepth = 8, floorHeight = 3

// Ground floor front half (grey brick)
part(new THREE.BoxGeometry(mainWidth, floorHeight, mainDepth / 2), colors.brick,
     0, floorHeight / 2, -mainDepth / 4)

// Ground floor rear half (white render)
part(new THREE.BoxGeometry(mainWidth, floorHeight, mainDepth / 2), colors.white,
     0, floorHeight / 2, mainDepth / 4)

// Upper floor (white render)
part(new THREE.BoxGeometry(mainWidth, floorHeight, mainDepth), colors.white,
     0, floorHeight + floorHeight / 2, 0)

// Large black‑frame glass slab on front façade
part(new THREE.BoxGeometry(4, 2, 0.12), colors.black,
     0, floorHeight + 1, -mainDepth / 2 - 0.06)

// Thin black balustrade cylinder on top of the glass slab
part(new THREE.CylinderGeometry(2, 2, 0.2, 32), colors.black,
     0, floorHeight + 2 + 0.1, -mainDepth / 2 - 0.06)

// Flat roof slab (white)
part(new THREE.BoxGeometry(mainWidth, 0.3, mainDepth), colors.white,
     0, floorHeight * 2 + 0.15, 0)

// --- Secondary wing ------------------------------------------------
const secWidth = 5, secDepth = 8, secHeight = 6
const secCenterX = mainWidth / 2 + secWidth / 2   // attaches to right side of main wing

// Main block (white render)
part(new THREE.BoxGeometry(secWidth, secHeight, secDepth), colors.white,
     secCenterX, secHeight / 2, 0)

// Gable roof approximation (dark‑grey block)
part(new THREE.BoxGeometry(secWidth, 2, secDepth), colors.roofGable,
     secCenterX, secHeight + 1, 0)

// Tall triangular glass window (cone) on front façade
part(new THREE.ConeGeometry(2.5, 4, 32, 1, true), colors.glass,
     secCenterX, secHeight / 2 + 2, -secDepth / 2 - 0.06)
part(new THREE.ConeGeometry(2.5, 4, 32, 1, true), colors.black,
     secCenterX, secHeight / 2 + 2, -secDepth / 2 - 0.06).material.side = THREE.DoubleSide
part(new THREE.ConeGeometry(2.5, 4, 32, 1, true), colors.black,
     secCenterX, secHeight / 2 + 2, -secDepth / 2 - 0.06).rotation.y = Math.PI // hide inner side

// Vertical wood‑clad strips on front façade
const stripCount = 9
const stripSpacing = secWidth / (stripCount + 1)
for (let i = 1; i <= stripCount; i++) {
  const xPos = secCenterX - secWidth / 2 + i * stripSpacing
  part(new THREE.CylinderGeometry(0.05, 0.05, secHeight, 12), colors.wood,
       xPos, secHeight / 2, -secDepth / 2 - 0.07)
}

// --- Additional details ------------------------------------------------
// Small shrub spheres near front left
part(new THREE.SphereGeometry(0.6, 12, 8), colors.foliage, -5, 0.6, -2)
part(new THREE.SphereGeometry(0.5, 12, 8), colors.foliage, -3, 0.5, -3)

// Return the assembled group
return group
function hMat(c){return new THREE.MeshStandardMaterial({color:c,roughness:0.85})}
function hBox(g,w,h,d,x,y,z,c){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),hMat(c));m.position.set(x,y+h/2,z);g.add(m);return m}
function hCyl(g,r,h,x,y,z,c){var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),hMat(c));m.position.set(x,y+h/2,z);g.add(m);return m}
function hRoof(g,w,d,rise,x,y,z,c,ridgeX){var across=ridgeX?d:w;var len=ridgeX?w:d;var r=across/1.7321;var geo=new THREE.CylinderGeometry(r,r,len,3);geo.rotateX(-Math.PI/2);var m=new THREE.Mesh(geo,hMat(c));var s=rise/(1.5*r);m.scale.set(1,s,1);m.position.set(x,y+0.5*r*s,z);if(ridgeX)m.rotation.y=Math.PI/2;g.add(m);return m}
function hWin(g,x,y,z,w,h,face,c){var s=face.charAt(0)==='-'?-1:1;var ax=face.replace('-','');var m;if(ax==='z'){m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.08),hMat(c));m.position.set(x,y+h/2,z+s*0.04)}else{m=new THREE.Mesh(new THREE.BoxGeometry(0.08,h,w),hMat(c));m.position.set(x+s*0.04,y+h/2,z)}g.add(m);return m}
}
(function(){
var er=document.getElementById('err');
if(typeof THREE==='undefined'){er.textContent='3D library failed to load. Check your internet.';return}
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0d0c);
var cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
var ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x333344,0.9));
var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(5,8,5);scene.add(dl);
scene.add(new THREE.GridHelper(10,20,0x7C83DB,0x2a2a35));
var model;try{model=buildModel(THREE)}catch(e){model=new THREE.Group();er.textContent='Model error: '+e.message}
var box=new THREE.Box3().setFromObject(model);var sz=box.getSize(new THREE.Vector3());var mx=Math.max(sz.x,sz.y,sz.z)||1;model.scale.setScalar(3/mx);
box=new THREE.Box3().setFromObject(model);var c=box.getCenter(new THREE.Vector3());model.position.x-=c.x;model.position.z-=c.z;model.position.y-=box.min.y;scene.add(model);
var parts=[];model.traverse(function(o){if(o.isMesh)parts.push(o)});
var fin=parts.map(function(o){return {s:o.scale.clone(),y:o.position.y}});
var N=parts.length,per=Math.max(30,Math.min(110,2600/Math.max(N,1))),t0=performance.now(),hn=document.getElementById('hint'),building=true;
parts.forEach(function(o){o.visible=false});
function stepBuild(now){var el=now-t0;for(var i=0;i<N;i++){var k=(el-i*per)/260,o=parts[i];if(k<=0){o.visible=false;continue}o.visible=true;if(k>=1){o.scale.copy(fin[i].s);o.position.y=fin[i].y}else{var e=1-Math.pow(1-k,3);o.scale.set(fin[i].s.x*e,fin[i].s.y*e,fin[i].s.z*e);o.position.y=fin[i].y+(1-e)*0.6}}
var done=Math.min(N,Math.floor(el/per)+1);hn.textContent=done<N?('Building part '+done+' of '+N):'Drag to rotate - scroll to zoom';return el>per*N+300}
document.getElementById('rp').onclick=function(){t0=performance.now();building=true};
var th=0.8,ph=1.1,d=7,auto=true,drag=false,lx=0,ly=0;
function cp(){cam.position.set(d*Math.sin(ph)*Math.sin(th),d*Math.cos(ph)+1.2,d*Math.sin(ph)*Math.cos(th));cam.lookAt(0,1.2,0)}
var el=ren.domElement;el.style.touchAction='none';
el.addEventListener('pointerdown',function(e){drag=true;auto=false;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',function(){drag=false});
addEventListener('pointermove',function(e){if(!drag)return;th-=(e.clientX-lx)*0.01;ph=Math.max(0.2,Math.min(1.5,ph-(e.clientY-ly)*0.01));lx=e.clientX;ly=e.clientY});
el.addEventListener('wheel',function(e){e.preventDefault();d=Math.max(3,Math.min(14,d+e.deltaY*0.005))},{passive:false});
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
(function loop(){requestAnimationFrame(loop);if(building){building=!stepBuild(performance.now())}if(auto)th+=(building?0.012:0.006);cp();ren.render(scene,cam)})();
})();
</script></body></html>
